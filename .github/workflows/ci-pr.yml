name: ReTech CI - Pull Request Verification

on:
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --prefix database run generate

      - name: Compile Database Workspace
        run: npm --prefix database run build

      - name: Type Check Backend
        run: npm --prefix backend run build

      - name: Type Check & Lint Frontend
        run: npm --prefix frontend run build

  unit-and-integration-tests:
    name: Jest Unit & Integration Test Suite
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm --prefix database run generate

      - name: Run Backend Test Suite with Coverage
        run: npm --prefix backend test -- --coverage
